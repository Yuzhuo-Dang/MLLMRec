#Baby
feat_embed_dim: [512]
learning_rate: 0.0001

n_ii_layers: 1
n_ui_layers: 2

knn_k: 10
knn_jac: [15]
pure: [0.7]
drop_g: [0.6]

mllm_model: ['qwen2.5vl_7b']

sem_weight: [0.0001]
info_weight: [0.01]

hyper_parameters: ["feat_embed_dim", "knn_jac", "pure", "mllm_model", "sem_weight", "drop_g", "info_weight"]

